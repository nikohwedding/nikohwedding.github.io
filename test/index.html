<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cormorant Garamond', serif;
background:#0f0f0f;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
url('photo.jpg') center/cover;
}

.content{
animation:fade 2s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.subtitle{
letter-spacing:6px;
font-size:18px;
color:#d4af37;
}

.title{
font-size:80px;
margin-top:20px;
color:#d4af37;
line-height:1.2;
}

.date{
margin-top:25px;
font-size:28px;
letter-spacing:2px;
}

.btn{
margin-top:40px;
padding:14px 38px;
border:1px solid #d4af37;
background:transparent;
color:#d4af37;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.4s;
}

.btn:hover{
background:#d4af37;
color:black;
}

.section{
padding:100px 20px;
text-align:center;
}

.section h2{
font-size:56px;
color:#d4af37;
margin-bottom:40px;
}

.timer{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.box{
width:120px;
height:120px;
border:1px solid #d4af37;
border-radius:24px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.box span{
font-size:42px;
color:#d4af37;
}

.box p{
margin-top:10px;
font-size:18px;
}

iframe{
width:100%;
height:400px;
border:none;
border-radius:24px;
margin-top:40px;
max-width:1000px;
}

footer{
padding:50px;
text-align:center;
color:#999;
font-size:22px;
}

</style>

</head>

<body>

<section class="hero">

<div class="content">

<div class="subtitle">
WEDDING DAY
</div>

<div class="title">
Abdulaziz <br>
& <br>
Shahinabonu
</div>

<div class="date">
07 Avgust 2025 | Royal Hall
</div>

<a href="#countdown">
<button class="btn">
Open Invitation
</button>
</a>

</div>

</section>

<section class="section" id="countdown">

<h2>To'ygacha Qoldi</h2>

<div class="timer">

<div class="box">
<span id="days">0</span>
<p>Kun</p>
</div>

<div class="box">
<span id="hours">0</span>
<p>Soat</p>
</div>

<div class="box">
<span id="minutes">0</span>
<p>Daqiqa</p>
</div>

<div class="box">
<span id="seconds">0</span>
<p>Soniya</p>
</div>

</div>

</section>

<section class="section">

<h2>Manzil</h2>

<p>Royal Hall — Samarqand</p>

<iframe src="https://www.google.com/maps?q=39.64737200258995,66.95507941354002&hl=es;z=15&output=embed"></iframe>

</section>

<footer>
Abdulaziz & Shahinabonu
</footer>

<script>

const weddingDate = new Date("Aug 7, 2025 19:00:00").getTime();

setInterval(() => {

const now = new Date().getTime();
const distance = weddingDate - now;

const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

}, 1000);

</script>

</body>
</html>
