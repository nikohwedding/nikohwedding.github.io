<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat', sans-serif;
background:#f8f6f2;
color:#222;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:white;
padding:50px 30px;
border-radius:30px;
max-width:550px;
width:100%;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.photo{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
margin-bottom:30px;
}

.names{
font-size:52px;
font-weight:300;
line-height:1.4;
}

.date{
margin-top:25px;
font-size:22px;
font-weight:600;
}

.text{
margin-top:25px;
line-height:1.8;
color:#777;
}

.btn{
margin-top:35px;
padding:14px 32px;
background:#222;
color:white;
border:none;
border-radius:40px;
cursor:pointer;
}

.gallery{
padding:100px 20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
max-width:1200px;
margin:auto;
}

.gallery img{
width:100%;
height:600px;
object-fit:cover;
border-radius:30px;
}

.timer{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:80px 20px;
}

.box{
background:white;
padding:25px;
width:110px;
border-radius:24px;
box-shadow:0 5px 20px rgba(0,0,0,.06);
text-align:center;
}

.box span{
font-size:38px;
font-weight:600;
}

iframe{
width:100%;
height:400px;
border:none;
border-radius:30px;
max-width:1100px;
display:block;
margin:50px auto;
}

footer{
padding:50px;
text-align:center;
color:#777;
}

</style>
</head>

<body>

<section class="hero">

<div class="card">

<img src="photo.jpg" class="photo">

<div class="names">
Abdulaziz <br>
& <br>
Shahinabonu
</div>

<div class="date">
07 August 2025
</div>

<div class="text">
Sizni to'yimizga taklif qilamiz
</div>

<button class="btn">
Open Invitation
</button>

</div>

</section>

<section class="gallery">

<img src="photo.jpg">
<img src="photo2.jpg">

</section>

<section class="timer">

<div class="box">
<span id="days">0</span>
<p>Kun</p>
</div>

<div class="box">
<span id="hours">0</span>
<p>Soat</p>
</div>

<div class="box">
<span id="minutes">0</span>
<p>Daqiqa</p>
</div>

<div class="box">
<span id="seconds">0</span>
<p>Soniya</p>
</div>

</section>

<iframe src="https://www.google.com/maps?q=39.64737200258995,66.95507941354002&hl=es;z=15&output=embed"></iframe>

<footer>
Royal Hall • Samarqand
</footer>

<script>

const weddingDate = new Date("Aug 7, 2025 19:00:00").getTime();

setInterval(() => {

const now = new Date().getTime();
const distance = weddingDate - now;

document.getElementById("days").innerHTML =
Math.floor(distance / (1000 * 60 * 60 * 24));

document.getElementById("hours").innerHTML =
Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

document.getElementById("minutes").innerHTML =
Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

document.getElementById("seconds").innerHTML =
Math.floor((distance % (1000 * 60)) / 1000);

},1000);

</script>

</body>
</html>
